name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'Drift_icon.png'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.1'
  NDK_VERSION: '27.2.12479018'
  ABI: arm64-v8a
  QT_ARCH: android_arm64_v8a

jobs:
  build:
    name: Build and sign ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK and NDK paths
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm pkg-config ccache \
            libgl1 libegl1 libxkbcommon0 libfontconfig1

      - name: Install Android NDK, platform and build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "ndk;$NDK_VERSION" \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Install Qt host tools and Android kit
        run: |
          pipx install aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            -m qtmultimedia qtshadertools -O "$HOME/Qt"
          aqt install-qt all_os android "$QT_VERSION" "$QT_ARCH" \
            -m qtmultimedia qtshadertools -O "$HOME/Qt"
          KIT="$HOME/Qt/$QT_VERSION/$QT_ARCH"
          find "$KIT/bin" "$KIT/libexec" -maxdepth 1 -type f \
            ! -name '*.bat' -exec chmod +x {} +

      - name: Restore Android native dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/prebuilt
          key: android-deps-${{ env.ABI }}-${{ env.NDK_VERSION }}-${{ hashFiles('third_party/build-android.sh') }}

      - name: Build Android native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./third_party/build-android.sh "$ABI"

      - name: Save Android native dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/prebuilt
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Remove downloaded dependency source trees
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: rm -rf third_party/src

      - name: Restore C/C++ compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.ABI }}-${{ github.sha }}
          restore-keys: ccache-${{ env.ABI }}-

      - name: Build release APK
        env:
          DRIFT_ANDROID_PACKAGE_NAME: org.cutwire.drift.ci
          DRIFT_ANDROID_APP_NAME: Drift CI
          DRIFT_ANDROID_VERSION_CODE: ${{ github.run_number }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
        run: |
          export QT_ANDROID_ROOT="$HOME/Qt/$QT_VERSION/$QT_ARCH"
          export QT_HOST_PATH="$HOME/Qt/$QT_VERSION/gcc_64"
          ./scripts/build.sh "$ABI" Release
          ccache -s

      - name: Save C/C++ compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.ABI }}-${{ github.sha }}

      - name: Collect unsigned APK
        run: |
          set -euo pipefail
          BUILD="build/android-$ABI"
          APK="$(find "$BUILD/android-build/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            APK="$(find "$BUILD/android-build" -type f -name '*release*.apk' -print -quit)"
          fi
          if [ -z "$APK" ]; then
            echo 'ERROR: Could not find the generated release APK.' >&2
            find "$BUILD" -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/drift-arm64-v8a-unsigned.apk"
          echo "Found APK: $APK"

      - name: Restore persistent debug signing key
        id: debug-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: drift-android-debug-signing-key-v1

      - name: Create debug signing key if needed
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Zipalign and sign installable APK
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="$RUNNER_TEMP/out/drift-arm64-v8a-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/out/drift-arm64-v8a-aligned.apk"
          SIGNED="$RUNNER_TEMP/drift-arm64-v8a.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose "$SIGNED"
          echo "Signed APK ready: $SIGNED"

      - name: Save persistent debug signing key
        if: steps.debug-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: drift-android-debug-signing-key-v1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-arm64-v8a-apk
          path: ${{ runner.temp }}/drift-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download on the rolling prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep one current CI release so the APK download link stays stable.
          if gh release view ci-latest >/dev/null 2>&1; then
            gh release delete ci-latest --yes --cleanup-tag
          else
            git push origin --delete ci-latest 2>/dev/null || true
          fi
          gh release create ci-latest \
            "$RUNNER_TEMP/drift-arm64-v8a.apk" \
            --target "$GITHUB_SHA" \
            --title 'Latest Installable Android APK' \
            --notes "Automatically built from commit ${GITHUB_SHA::7}. This is a debug-signed testing build for arm64-v8a, not an official stable release." \
            --prerelease
            
